[package]
name = "sol-stream"
version = "0.1.0"
edition = "2021"
description = "Real-time holder and trade state for Solana tokens from Geyser, pushed over WebSocket"

[[bin]]
name = "sol-stream"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bs58 = "0.5"
rand = "0.8"
parking_lot = "0.12"
tower-http = { version = "0.6", features = ["cors"] }

# Geyser (Yellowstone gRPC). Optional so the service builds and runs in --sim mode
# without the gRPC toolchain.
yellowstone-grpc-client = { version = "13", optional = true }
yellowstone-grpc-proto = { version = "12", optional = true }

[features]
default = ["geyser"]
geyser = ["yellowstone-grpc-client", "yellowstone-grpc-proto"]

[profile.release]
opt-level = 3
